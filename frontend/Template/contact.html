<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact us – T Level Connect</title>
  <link rel="stylesheet" href="Sources/css/tokens.css">
  <link rel="stylesheet" href="Sources/css/topNavBar.css">
  <link rel="stylesheet" href="Sources/css/accessibility.css">
  <link rel="stylesheet" href="Sources/css/motion.css">
  <script src="Sources/js/accessibility.js"></script>
  <script src="Sources/js/topNavBar.js" defer></script>
  <link rel="stylesheet" href="Sources/css/footer.css">
  <link rel="stylesheet" href="Sources/css/chatWidget.css">
  <link rel="stylesheet" href="Sources/css/auth.css">
  <script src="Sources/js/footer.js" defer></script>
  <script src="Sources/js/chatWidget.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card auth-card--figma" aria-labelledby="contact-title">
      {% if error %}
      <div class="auth-error-summary" role="alert">
        <p class="auth-error-summary-title">There is a problem</p>
        <ul class="auth-error-summary-list"><li>{{ error }}</li></ul>
      </div>
      {% endif %}
      <h1 id="contact-title" class="auth-title">Contact us</h1>
      {% if success %}
        <p class="auth-subtitle">We'll reply to the email address you gave us.</p>
        <p class="form-message form-message--success" role="status">Thanks, your message has been sent.</p>
      {% else %}
        <p class="auth-subtitle">Send us a message and we'll get back to you by email</p>
        <form class="auth-form" method="post" action="/contact">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="auth-field">
            <label for="contact-name">Name</label>
            <input id="contact-name" name="name" type="text" autocomplete="name" maxlength="100" required
                   value="{{ request.form.name or (current_user.name if current_user else '') }}">
          </div>
          <div class="auth-field">
            <label for="contact-email">Email</label>
            <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required
                   value="{{ request.form.email or (current_user.email if current_user else '') }}">
          </div>
          <div class="auth-field">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" maxlength="2000" required>{{ request.form.message }}</textarea>
          </div>
          <button type="submit" class="auth-primary">Send message</button>
        </form>
      {% endif %}
    </section>
  </main>
</body>
</html>
