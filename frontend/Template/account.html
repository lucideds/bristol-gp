<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your account – T Level Connect</title>
  <link rel="stylesheet" href="Sources/topNavBar.css">
  <link rel="stylesheet" href="Sources/footer.css">
  <link rel="stylesheet" href="Sources/chatWidget.css">
  <link rel="stylesheet" href="Sources/auth.css">
  <script src="Sources/topNavBar.js" defer></script>
  <script src="Sources/footer.js" defer></script>
  <script src="Sources/chatWidget.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="account-title">
      <h1 id="account-title" class="auth-title">Your account</h1>
      <dl class="account-details">
        <dt>Name</dt>
        <dd>{{ current_user.name }}</dd>
        <dt>Email</dt>
        <dd>{{ current_user.email }}</dd>
        <dt>Member since</dt>
        <dd>{{ current_user.created_at[:10] }}</dd>
      </dl>
      <form method="post" action="/logout">
        <button type="submit" class="auth-primary">Sign out</button>
      </form>
    </section>
  </main>
</body>
</html>
